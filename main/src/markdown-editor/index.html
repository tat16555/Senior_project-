<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Editor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>สร้างบทความ</h1>
        <p>เพิ่มรูปด้วยการใส่ลิ้ง</p>
        <div class="toolbar">
            <button id="bold" title="Bold"><i class="fas fa-bold"></i></button>
            <button id="italic" title="Italic"><i class="fas fa-italic"></i></button>
            <button id="underline" title="Underline"><i class="fas fa-underline"></i></button>
            <button id="code" title="Code"><i class="fas fa-code"></i></button>
            <button id="header" title="Header"><i class="fas fa-heading"></i></button>
            <button id="link" title="Link"><i class="fas fa-link"></i></button>
            <button id="list" title="List"><i class="fas fa-list"></i></button>
            <button id="quote" title="Quote"><i class="fas fa-quote-right"></i></button>
            <button id="save" title="Save"><i class="fas fa-save"></i></button>
        </div>
        <div class="editor-preview-container">
            <div class="editor">
                <textarea id="editor"></textarea>
            </div>
            <div class="preview" id="preview"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/markdown/markdown.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
